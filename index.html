<!DOCTYPE html>
<html lang="pt-BR">
    <link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <title>Missão AgroSustentável - Agrinho 2026</title>
    
</head>
<body>

<div id="jogo-container">
    <h2>🚜 Missão AgroSustentável</h2>
    
    <div class="status-bar">
        <div>💰 Moedas: <span id="moedas">100</span></div>
        <div>🌳 Sustentabilidade: <span id="sustentabilidade">50</span>%</div>
    </div>

    <div id="cenario">🚜 Fazenda Degradada</div>

    <p id="pergunta">Dilema 1: Pragas atacaram a plantação de soja! O que você faz?</p>

    <div id="botoes">
        <button onclick="escolha(1)">Usar pesticida químico pesado (Rápido e Barato)</button>
        <button onclick="escolha(2)">Usar controle biológico e defensivo natural</button>
    </div>
</div>

<script>
    let moedas = 100;
    let sust = 50;

    function escolha(opcao) {
        if (opcao === 1) {
            moedas += 50; // Ganha dinheiro rápido
            sust -= 20;   // Destrói o meio ambiente
            alert("Você eliminou as pragas, mas poluiu o solo e o lençol freático!");
        } else if (opcao === 2) {
            moedas -= 20; // Gasta um pouco para aplicar
            sust += 25;   // Melhora o meio ambiente
            alert("Demorou um pouco mais, mas a fauna local foi preservada e o solo continua saudável!");
        }

        // Atualiza os dados na tela
        document.getElementById("moedas").innerText = moedas;
        document.getElementById("sustentabilidade").innerText = sust;

        // Atualiza o cenário visual dinamicamente baseado na sustentabilidade
        let cenarioHtml = document.getElementById("cenario");
        if (sust >= 70) {
            cenarioHtml.style.backgroundColor = "#2e7d32"; // Verde vivo
            cenarioHtml.innerText = "🌳 Fazenda Próspera e Verde!";
        } else if (sust < 40) {
            cenarioHtml.style.backgroundColor = "#5d4037"; // Marrom escuro/seco
            cenarioHtml.innerText = "⚠️ Alerta: Solo Seco e Sem Vida";
        }

        // Checa fim de jogo
        if (sust <= 0) {
            alert("Fim de Jogo! Sua fazenda faliu ecologicamente.");
            reiniciar();
        } else if (sust >= 100 && moedas >= 150) {
            alert("Parabéns! Você alcançou o equilíbrio perfeito e venceu o Agrinho!");
            reiniciar();
        }
    }

    function reiniciar() {
        moedas = 100;
        sust = 50;
        document.getElementById("moedas").innerText = moedas;
        document.getElementById("sustentabilidade").innerText = sust;
        document.getElementById("cenario").style.backgroundColor = "#8d6e63";
        document.getElementById("cenario").innerText = "🚜 Fazenda Degradada";
    }
</script>

</body>
</html>
